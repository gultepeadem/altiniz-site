<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Altın İz | Fiziksel Altın Portföy Takibi</title>

  <meta
    name="description"
    content="Altın İz, fiziksel altın varlıklarını, maliyetlerini ve portföy değerini tek yerde takip etmeyi amaçlayan iOS ve Android mobil uygulamasıdır."
  >

  <style>
    :root {
      --background: #0f172a;
      --surface: #172033;
      --surface-light: #1e293b;
      --gold: #f5c451;
      --gold-dark: #d9a62e;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: rgba(255, 255, 255, 0.10);
      --success: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(245, 196, 81, 0.16), transparent 32%),
        linear-gradient(180deg, var(--background), #0b1120);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .site-header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111827;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(245, 196, 81, 0.20);
    }

    .header-link {
      color: var(--muted);
      font-size: 15px;
      text-decoration: none;
    }

    .header-link:hover {
      color: var(--gold);
    }

    .hero {
      padding: 90px 0 72px;
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 8px 14px;
      border: 1px solid rgba(134, 239, 172, 0.25);
      border-radius: 999px;
      background: rgba(134, 239, 172, 0.08);
      color: var(--success);
      font-size: 14px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 14px var(--success);
    }

    h1 {
      max-width: 900px;
      margin: 0 auto;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.08;
      letter-spacing: -2px;
    }

    .gold-text {
      color: var(--gold);
    }

    .hero-description {
      max-width: 760px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(18px, 2.4vw, 22px);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111827;
    }

    .button-secondary {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .section {
      padding: 72px 0;
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 36px;
    }

    .section-label {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h2 {
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.2;
      letter-spacing: -1px;
    }

    .section-description {
      margin-top: 14px;
      color: var(--muted);
      font-size: 18px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .feature-card {
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(
        145deg,
        rgba(30, 41, 59, 0.92),
        rgba(23, 32, 51, 0.92)
      );
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.18);
    }

    .feature-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin-bottom: 18px;
      place-items: center;
      border-radius: 14px;
      background: rgba(245, 196, 81, 0.13);
      color: var(--gold);
      font-size: 23px;
    }

    .feature-card h3 {
      margin-bottom: 9px;
      font-size: 19px;
    }

    .feature-card p {
      color: var(--muted);
      font-size: 15px;
    }

    .ai-section {
      padding: 72px 0;
    }

    .ai-panel {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 38px;
      align-items: center;
      padding: 42px;
      border: 1px solid rgba(245, 196, 81, 0.22);
      border-radius: 28px;
      background:
        radial-gradient(circle at top right, rgba(245, 196, 81, 0.12), transparent 36%),
        var(--surface);
    }

    .ai-list {
      display: grid;
      gap: 14px;
      margin-top: 24px;
      list-style: none;
    }

    .ai-list li {
      display: flex;
      gap: 12px;
      color: var(--muted);
    }

    .check {
      color: var(--gold);
      font-weight: 900;
    }

    .example-box {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.70);
    }

    .example-label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .example-input {
      padding: 16px;
      border-left: 3px solid var(--gold);
      color: var(--text);
      font-size: 17px;
    }

    .example-result {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .result-item
